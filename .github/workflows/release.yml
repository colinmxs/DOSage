name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v0.1.0, v1.2.3

permissions:
  contents: write  # Needed to create releases

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for release notes
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run full test suite
        run: npm test
      
      - name: Run linting
        run: npm run lint
      
      - name: Run type checking
        run: npm run typecheck
      
      - name: Build library
        run: npm run build
      
      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "📦 Version: ${VERSION}"
      
      - name: Create distributable package
        run: |
          npm pack
          PACKAGE_FILE=$(ls dosage-*.tgz)
          mv "$PACKAGE_FILE" "dosage-${{ steps.get_version.outputs.VERSION }}.tgz"
          echo "Created: dosage-${{ steps.get_version.outputs.VERSION }}.tgz"
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.TAG }}
          name: Release ${{ steps.get_version.outputs.TAG }}
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.VERSION, '-') }}
          generate_release_notes: true
          files: |
            dosage-${{ steps.get_version.outputs.VERSION }}.tgz
          body: |
            ## 📦 Installation
            
            ```bash
            npm install dosage@${{ steps.get_version.outputs.VERSION }}
            ```
            
            ## 📥 Download
            
            You can also download the package directly from the assets below:
            - `dosage-${{ steps.get_version.outputs.VERSION }}.tgz` - Complete package (ESM + CJS + Types + CSS)
            
            ## 📝 Changes
            
            See the auto-generated release notes below for details on what changed in this release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
